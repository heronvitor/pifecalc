<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f9">
  <meta name="color-scheme" content="only light">
  <title>Construtor de Pífanos</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <h1>Construtor de Pífanos</h1>
      <details class="menu">
        <summary aria-label="Menu de projetos">☰</summary>
        <div class="menu-itens">
          <button type="button" data-acao="novo">Novo pífano</button>
          <button type="button" data-acao="renomear">Renomear</button>
          <button type="button" data-acao="exportar">Exportar (arquivo)</button>
          <button type="button" data-acao="importar">Importar arquivo</button>
          <button type="button" data-acao="imprimir">Imprimir gabarito</button>
          <button type="button" data-acao="apagar" class="perigo">Apagar este pífano</button>
        </div>
      </details>
    </div>
    <label class="projeto">
      <span class="sr">Pífano</span>
      <select id="projeto"></select>
    </label>
    <nav id="passos" class="passos" aria-label="Etapas"></nav>
  </header>

  <main>
    <section id="tubo" class="tubo" aria-label="Desenho do pífano"></section>
    <section id="passo" class="passo"></section>
    <div class="navegacao">
      <button type="button" id="anterior" class="secundario">← Anterior</button>
      <button type="button" id="proximo">Próximo →</button>
    </div>
    <p class="rodape">Os dados ficam guardados neste aparelho.</p>
  </main>

  <button type="button" id="abrirAfinador" class="flutuante">♪ Afinador</button>

  <div id="afinador" class="folha" hidden>
    <div class="folha-topo">
      <strong>Afinador</strong>
      <button type="button" id="fecharAfinador" class="secundario pequeno">Fechar</button>
    </div>
    <p class="af-alvo" id="afAlvo"></p>
    <div class="af-nota" id="afNota">—</div>
    <div class="af-hz" id="afHz">&nbsp;</div>
    <div class="medidor" aria-hidden="true">
      <div class="medidor-faixa"></div>
      <div class="medidor-centro"></div>
      <div class="agulha" id="afAgulha"></div>
      <div class="medidor-rotulos"><span>−50</span><span>−25</span><span>0</span><span>+25</span><span>+50</span></div>
    </div>
    <div class="af-cents" id="afCents">&nbsp;</div>
    <div class="af-botoes">
      <button type="button" id="afTom" class="secundario">▶ Ouvir alvo</button>
    </div>
    <p class="af-msg" id="afMsg"></p>
  </div>

  <input type="file" id="arquivo" accept="application/json,.json" hidden>

  <section id="impressao" aria-hidden="true"></section>

  <script src="js/acustica.js"></script>
  <script src="js/afinador.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
